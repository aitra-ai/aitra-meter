<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aitra Meter · Demo Control</title>
<style>
  :root{--bg:#14181A;--surface:#1C2225;--ink:#E8E6E0;--soft:#9AA4A8;--line:#2E3639;
        --accent:#E8A020;--accent-soft:#3A2F18;--tele:#4FB3B8;--warn:#E0705F;--ok:#5FBF8A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:28px 20px 60px}
  main{max-width:780px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--soft);font-size:13px;margin-bottom:22px}
  #lang{border:1px solid var(--line);background:transparent;color:var(--soft);
        border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;flex-shrink:0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin:12px 0}
  .lbl{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:600;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .grid.narrow{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  .opt{border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;
       font-family:ui-monospace,Menlo,monospace;font-size:12.5px;text-align:center;user-select:none}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
  .opt small{display:block;font-family:inherit;color:var(--soft);font-size:10.5px}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center}
  button{border:0;border-radius:6px;padding:11px 24px;font-size:15px;font-weight:700;cursor:pointer}
  #go{background:var(--accent);color:#14181A}
  #stop{background:transparent;color:var(--warn);border:1px solid var(--warn)}
  .scenebtn{background:transparent;color:var(--tele);border:1px solid var(--tele);font-size:13px;padding:9px 16px}
  #lg{background:transparent;border:1px solid var(--soft);color:var(--ink);font-size:13px;padding:9px 16px}
  #lg.off{border-color:var(--warn);color:var(--warn)}
  #msg{font-size:13.5px;margin-top:10px;min-height:20px}
  #msg.err{color:var(--warn)} #msg.ok{color:var(--ok)}
  table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
  th{color:var(--soft);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.08em;
     padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
  td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);
     font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .st-running{color:var(--ok)} .st-pending{color:var(--accent)} .st-done{color:var(--soft)} .st-failed{color:var(--warn)}
  .stats{display:flex;gap:26px;flex-wrap:wrap;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .stats b{font-size:19px;color:var(--accent)}
  a{color:var(--tele)}
  #health{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;
          font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);
          border-radius:8px;padding:10px 16px;margin:0 0 14px;background:var(--surface)}
  #health .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .h-ok{background:var(--ok)} .h-warn{background:var(--accent)} .h-bad{background:var(--warn)}
  .abtn{background:transparent;color:var(--accent);border:1px solid var(--accent);
        font-size:13px;padding:9px 16px;font-weight:600}
  .abtn:disabled{opacity:.4;cursor:wait}
  .astep{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-size:12px;
         font-family:ui-monospace,Menlo,monospace;color:var(--soft)}
  .adot{width:8px;height:8px;border-radius:50%;background:#3a4548;display:inline-block}
  .adot.running{background:var(--accent);animation:ap 1s infinite}
  .adot.done{background:var(--ok)} .adot.failed{background:var(--warn)}
  @keyframes ap{50%{opacity:.3}}
  .abill{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;margin-top:8px;color:var(--ink)}
  .abill b{color:var(--accent)}
  .rack{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:640px){.rack{grid-template-columns:repeat(2,1fr)}}
  .slot{border:1px dashed var(--line);border-radius:8px;min-height:86px;padding:10px 12px;
        display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:center;
        font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--soft);
        transition:border-color .15s, background .15s;position:relative}
  .slot .gpuTag{position:absolute;top:6px;left:9px;font-size:10px;color:#5a686c;letter-spacing:.08em}
  .slot.serving{border:1px solid var(--ok);color:var(--ink);cursor:grab}
  .slot.serving .mname{color:var(--ok);font-weight:700;font-size:12.5px}
  .slot.serving .mstats{color:var(--soft)}
  .slot.serving .mstats b{color:var(--ink)}
  .slot.loading{border:1px solid var(--accent);color:var(--accent)}
  .slot.loading .mname{font-weight:700}
  .slot.loading .spin{animation:ap 1s infinite}
  .slot.dropok{border-color:var(--accent);background:var(--accent-soft)}
  .slot .eject{position:absolute;top:4px;right:6px;background:none;border:0;color:var(--soft);
               font-size:13px;cursor:pointer;padding:2px 4px}
  .slot .eject:hover{color:var(--warn)}
  .shelf{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;border:1px dashed var(--line);
         border-radius:8px;padding:8px 10px;margin-top:12px;align-items:center}
  .shelf.dropok{border-color:var(--warn);background:#2a1c18}
  .chip{border:1px solid var(--tele);color:var(--tele);border-radius:6px;padding:7px 12px;
        font-family:ui-monospace,Menlo,monospace;font-size:12.5px;cursor:grab;user-select:none}
  .chip.selq{outline:2px solid var(--accent)}
  .shelfHint{font-size:12px;color:var(--soft)}
</style></head><body><main>
  <div class="top"><div>
    <h1>⚡ <span data-i18n="title"></span></h1>
    <div class="sub"><span data-i18n="sub"></span>
      <a id="glink" href="#" target="_blank" data-i18n="grafana"></a>.</div>
  </div><button id="lang">EN</button></div>

  <div id="health">…</div>

  <div class="card"><div class="lbl" data-i18n="rackTitle"></div>
    <div class="rack" id="rack"></div>
    <div class="shelf" id="shelf"><span class="shelfHint" data-i18n="shelfHint"></span></div>
    <div style="font-size:12px;color:var(--soft);margin-top:8px" data-i18n="rackHint"></div>
  </div>

  <div class="card"><div class="lbl" data-i18n="s1"></div><div class="grid" id="models"></div></div>
  <div class="card"><div class="lbl" data-i18n="s2"></div><div class="grid" id="shapes"></div></div>
  <div class="card"><div class="lbl" data-i18n="s3"></div><div class="grid narrow" id="conc"></div></div>
  <div class="card"><div class="lbl" data-i18n="s4"></div><div class="grid" id="durs"></div></div>

  <div class="row">
    <button id="go" data-i18n="go"></button>
    <button class="scenebtn" data-scene="sweep">📈 <span data-i18n="sweep"></span></button>
    <button class="scenebtn" data-scene="burst">💓 <span data-i18n="burst"></span></button>
    <button id="stop" data-i18n="stop"></button>
  </div>
  <div id="msg"></div>

  <div class="card"><div class="lbl" data-i18n="idleTitle"></div>
    <div class="row" style="margin-top:4px">
      <button id="lg">…</button>
      <span style="font-size:13px;color:var(--soft)" data-i18n="idleDesc"></span>
    </div>
  </div>

  <div class="card"><div class="lbl" data-i18n="statusTitle"></div>
    <div class="stats" id="stats"></div>
    <table style="margin-top:12px"><thead><tr><th data-i18n="thJob"></th><th data-i18n="thModel"></th><th data-i18n="thDesc"></th><th data-i18n="thState"></th></tr></thead>
    <tbody id="jobs"><tr><td colspan="4" style="color:var(--soft)">…</td></tr></tbody></table>
  </div>

  <div class="card"><div class="lbl" data-i18n="agentTitle"></div>
    <div class="row" style="margin-top:2px" id="agentBtns"></div>
    <div id="agentRuns" style="margin-top:10px;font-size:13px;color:var(--soft)">…</div>
  </div>

  <div class="card"><div class="lbl" data-i18n="jptTitle"></div>
    <table><thead><tr><th data-i18n="thModel"></th><th>GPU J/token</th><th data-i18n="thSystem"></th></tr></thead>
    <tbody id="jpt"></tbody></table>
  </div>
<script>
  const I18N = {
    zh: {
      title:'演示流量控制台', sub:'模型 × 任务形态 × 并发 × 时长,自由组合;或用预排场景。曲线看 ',
      grafana:'Grafana Demo 仪表盘',
      s1:'① 模型(可多选——同场景打到多个模型做对比)', s2:'② 任务形态',
      s3:'③ 并发(同时在飞的请求数)', s4:'④ 时长',
      go:'▶ 启动组合', sweep:'并发扫描 1→32', burst:'脉冲 ×8', stop:'■ 全部停止',
      idleTitle:'空载控制(常驻底噪流量)',
      idleDesc:'关闭后约 1 分钟:所有模型吞吐归零、J/token 归零、功率显示占卡静息值——空载演示入口。',
      statusTitle:'当前状态', jptTitle:'实时 J/token(30 秒窗口)',
      thJob:'任务', thModel:'模型', thDesc:'内容', thState:'状态',
      servingW:'干活功率', idleW:'待机功率', baseline:'底噪流量', on:'开', off:'关',
      lgOn:'⏻ 关闭底噪(进入空载)', lgOff:'⏻ 打开底噪(恢复常态)',
      pickModel:'请先选择至少一个模型(可多选)', starting:'启动中…',
      started:n=>`✓ 已启动 ${n} 个任务`, stopped:n=>`■ 已停止 ${n} 个任务`,
      noJobs:'当前没有演示任务', lgClosing:'正在关闭底噪…', lgOpening:'正在恢复底噪…',
      lgClosed:'✓ 底噪已关——约 1 分钟后进入空载形态', lgOpened:'✓ 底噪已恢复',
      rackTitle:'H100 节点机架(k8s-master · 8×H100-80G · 一卡一模型)',
      shelfHint:'已停用的模型会出现在这里——拖到上方空槽即可启动',
      rackHint:'拖动:模型芯片 → 空槽 = 启动(加载权重约 1-4 分钟);运行中的卡拖到下方架子(或点 ⏏)= 停止并释放 GPU。触屏:先点芯片再点空槽。',
      slotEmpty:'空闲 H100', slotNoRbac:'待授权(见部署说明)', slotLoading:'加载权重中…', wUnit:'W',
      stopConfirm:m=>`停止 ${m} 并释放这张 H100?`,
      agentTitle:'Agent 任务演示(任务级能耗账单)',
      agentHint:'发起一个多步 agent 任务,现场看它的能耗账单逐步累加(经 task-gateway 计量)。',
      thSystem:'系统 J/token(含主机)',
      hFleet:'模型在线', hHost:'主机功率', hBase:'底噪', hMeter:'计量',
      billLine:(b)=>`账单:${b.calls} 次调用 · ${b.output_tokens} tok · GPU ${Math.round(b.gpu_joules)} J` +
        (b.system_joules?` · 系统 ${Math.round(b.system_joules)} J`:'') +
        (b.cost_usd?` · $${b.cost_usd.toFixed(5)}`:'') + (b.co2_grams?` · ${b.co2_grams.toFixed(2)} gCO₂`:''),
      agentRunning:'运行中', agentDone:'完成', agentFailed:'失败', noAgent:'尚未发起 agent 演示',
      shapeDesc:{balanced:'输入512/输出256', summarize:'输入4096/输出64(重读)',
                 generate:'输入64/输出1024(重写)', sharegpt:'ShareGPT 真人对话'},
    },
    en: {
      title:'Demo Traffic Console', sub:'Combine model × shape × concurrency × duration, or use a scene. Watch curves on the ',
      grafana:'Grafana demo dashboards',
      s1:'① Models (multi-select — same scenario across models for comparison)', s2:'② Task shape',
      s3:'③ Concurrency (requests in flight)', s4:'④ Duration',
      go:'▶ Start', sweep:'Sweep 1→32', burst:'Burst ×8', stop:'■ Stop all',
      idleTitle:'Idle control (baseline traffic)',
      idleDesc:'Turn off and within ~1 min every model reads zero throughput and zero J/token while power shows the true resting draw — the idle-state demo.',
      statusTitle:'Current state', jptTitle:'Live J/token (30 s windows)',
      thJob:'Job', thModel:'Model', thDesc:'What', thState:'State',
      servingW:'Serving power', idleW:'Idle power', baseline:'Baseline traffic', on:'on', off:'off',
      lgOn:'⏻ Turn baseline off (go idle)', lgOff:'⏻ Turn baseline on (resume)',
      pickModel:'Select at least one model first', starting:'Starting…',
      started:n=>`✓ Started ${n} job(s)`, stopped:n=>`■ Stopped ${n} job(s)`,
      noJobs:'No demo jobs running', lgClosing:'Turning baseline off…', lgOpening:'Turning baseline on…',
      lgClosed:'✓ Baseline off — idle state in ~1 min', lgOpened:'✓ Baseline restored',
      rackTitle:'H100 node rack (k8s-master · 8×H100-80G · one model per GPU)',
      shelfHint:'Stopped models land here — drag one onto a free slot to start it',
      rackHint:'Drag: model chip → free slot = start (weights load in ~1-4 min); drag a serving card to the shelf (or click ⏏) = stop & free the GPU. Touch: tap chip, then tap a free slot.',
      slotEmpty:'free H100', slotNoRbac:'awaiting RBAC', slotLoading:'loading weights…', wUnit:'W',
      stopConfirm:m=>`Stop ${m} and free this H100?`,
      agentTitle:'Agent task demo (per-task energy bill)',
      agentHint:'Launch a multi-step agent task and watch its energy bill accrue live (metered via task-gateway).',
      thSystem:'System J/token (incl. host)',
      hFleet:'models up', hHost:'host power', hBase:'baseline', hMeter:'metering',
      billLine:(b)=>`Bill: ${b.calls} calls · ${b.output_tokens} tok · GPU ${Math.round(b.gpu_joules)} J` +
        (b.system_joules?` · system ${Math.round(b.system_joules)} J`:'') +
        (b.cost_usd?` · $${b.cost_usd.toFixed(5)}`:'') + (b.co2_grams?` · ${b.co2_grams.toFixed(2)} gCO₂`:''),
      agentRunning:'running', agentDone:'done', agentFailed:'failed', noAgent:'No agent demo started yet',
      shapeDesc:{balanced:'in 512 / out 256', summarize:'in 4096 / out 64 (read-heavy)',
                 generate:'in 64 / out 1024 (write-heavy)', sharegpt:'ShareGPT real dialogues'},
    },
  };
  let lang = localStorage.getItem('demo_lang') ||
             (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');
  const T = () => I18N[lang];
  function applyStatic() {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T()[el.dataset.i18n] || ''; });
    document.getElementById('lang').textContent = lang === 'zh' ? 'EN' : '中文';
    document.documentElement.lang = lang;
  }
  // Mount-point-agnostic API base: works at / (LAN), /console and /console/.
  const BASE = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
  const GRAFANA = localStorage.getItem('grafana_url') || 'https://meter.aitra.ai';
  document.getElementById('glink').href = GRAFANA + '/d/aitra-demo-a';
  let sel = {models: new Set(), shape: 'balanced', concurrency: 8, duration: 'forever'};
  let statusCache = null;

  function pill(txt, key, group, desc) {
    const d = document.createElement('div');
    d.className = 'opt'; d.innerHTML = txt + (desc ? `<small>${desc}</small>` : '');
    d.dataset.key = key;
    d.onclick = () => {
      if (group === 'model') {
        d.classList.toggle('sel');
        if (sel.models.has(key)) sel.models.delete(key); else sel.models.add(key);
      } else {
        sel[group] = (group === 'concurrency') ? parseInt(key) : key;
        d.parentNode.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
        d.classList.add('sel');
      }
    };
    return d;
  }
  function buildPickers(s) {
    const mBox = document.getElementById('models'); mBox.innerHTML = '';
    s.models.forEach(m => {
      const p = pill(m, m, 'model');
      if (sel.models.has(m)) p.classList.add('sel');
      mBox.appendChild(p);
    });
    const shBox = document.getElementById('shapes'); shBox.innerHTML = '';
    Object.entries(s.shapes).forEach(([k, lbls]) => {
      const p = pill(lbls[lang], k, 'shape', T().shapeDesc[k] || '');
      if (k === sel.shape) p.classList.add('sel');
      shBox.appendChild(p);
    });
    const cBox = document.getElementById('conc'); cBox.innerHTML = '';
    s.concurrency.forEach(c => {
      const p = pill(String(c), String(c), 'concurrency');
      if (c === sel.concurrency) p.classList.add('sel');
      cBox.appendChild(p);
    });
    const dBox = document.getElementById('durs'); dBox.innerHTML = '';
    Object.entries(s.durations).forEach(([k, lbls]) => {
      const p = pill(lbls[lang], k, 'duration');
      if (k === sel.duration) p.classList.add('sel');
      dBox.appendChild(p);
    });
  }
  async function refresh() {
    try {
      const r = await fetch(BASE + 'api/status');
      if (r.status === 401) { location.reload(); return; }
      const s = await r.json(); statusCache = s;
      buildPickers(s);
      const jb = document.getElementById('jobs');
      jb.innerHTML = s.jobs.length ? s.jobs.map(j =>
        `<tr><td>${j.name}</td><td>${j.model}</td><td>${j.desc}</td><td class="st-${j.state}">${j.state}</td></tr>`
      ).join('') : `<tr><td colspan="4" style="color:var(--soft)">${T().noJobs}</td></tr>`;
      const jt = document.getElementById('jpt');
      jt.innerHTML = Object.entries(s.jpt).sort((a,b)=>(a[1].gpu??a[1])-(b[1].gpu??b[1])).map(([m,v]) => {
        const gpu = (v && typeof v === 'object') ? v.gpu : v;
        const sys = (v && typeof v === 'object' && v.system != null) ? v.system : '—';
        return `<tr><td>${m}</td><td>${gpu}</td><td>${sys}</td></tr>`;
      }).join('');
      renderRack(s.rack || []);
      const h = s.health || {};
      const fl = h.models_up >= 0 ? `${h.models_up}/${h.fleet}` : '?';
      const flCls = h.models_up >= h.fleet ? 'h-ok' : (h.models_up > 0 ? 'h-warn' : 'h-bad');
      const meterOk = Object.keys(s.jpt||{}).length > 0;
      document.getElementById('health').innerHTML =
        `<span><span class="dot ${flCls}"></span>${T().hFleet} <b>${fl}</b></span>` +
        `<span><span class="dot ${h.host_w>0?'h-ok':'h-warn'}"></span>${T().hHost} <b>${h.host_w||'—'}</b> W</span>` +
        `<span><span class="dot ${s.loadgen>0?'h-ok':'h-bad'}"></span>${T().hBase} <b>${s.loadgen>0?T().on:T().off}</b></span>` +
        `<span><span class="dot ${meterOk?'h-ok':'h-bad'}"></span>${T().hMeter} <b>${meterOk?'OK':'—'}</b></span>`;
      const st = document.getElementById('stats');
      const p = s.power || {};
      st.innerHTML = `<span>${T().servingW} <b>${p.serving ?? '—'}</b> W</span>` +
                     `<span>${T().idleW} <b>${p.idle ?? '—'}</b> W</span>` +
                     `<span>${T().baseline} <b>${s.loadgen > 0 ? T().on : T().off}</b></span>`;
      const lg = document.getElementById('lg');
      lg.textContent = s.loadgen > 0 ? T().lgOn : T().lgOff;
      lg.className = s.loadgen > 0 ? '' : 'off';
      lg.dataset.on = s.loadgen > 0 ? '1' : '0';
    } catch (e) { /* keep last view */ }
  }
  const msg = document.getElementById('msg');
  function say(t, cls) { msg.textContent = t; msg.className = cls || ''; }
  async function post(path, body) {
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body || {})});
    return r.json();
  }
  function report(d) {
    const ok = (d.started || []).length;
    let t = ok ? T().started(ok) : '';
    if (d.errors && d.errors.length) t += (t ? ' · ' : '✗ ') + d.errors.join(' · ');
    say(t || '✗', d.errors && !ok ? 'err' : 'ok');
  }
  document.getElementById('go').onclick = async () => {
    if (!sel.models.size) { say(T().pickModel, 'err'); return; }
    say(T().starting);
    const d = await post(BASE + 'api/start',
      {models: [...sel.models], shape: sel.shape, concurrency: sel.concurrency, duration: sel.duration});
    report(d); refresh();
  };
  // ---- GPU rack: drag a model onto an H100 ----
  let tapSel = null; // touch fallback: selected shelf chip
  async function modelCtl(action, model) {
    const r = await fetch(BASE + 'api/model/' + action, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({model})});
    const j = await r.json().catch(()=>({}));
    const el = document.getElementById('msg');
    if (!r.ok) { el.className='err'; el.textContent = j.error || 'error'; }
    refresh();
  }
  function stopModel(m) { if (confirm(T().stopConfirm(m))) modelCtl('stop', m); }
  function renderRack(rack) {
    const rk = document.getElementById('rack'), sh = document.getElementById('shelf');
    rk.innerHTML = '';
    const stopped = [];
    rack.forEach((e, i) => {
      const d = document.createElement('div');
      d.innerHTML = `<span class="gpuTag">GPU ${i}</span>`;
      if (e.state === 'serving') {
        d.className = 'slot serving'; d.draggable = true;
        d.innerHTML += `<span class="mname">${e.model}</span>` +
          `<span class="mstats"><b>${e.power ?? '—'}</b> ${T().wUnit} · <b>${e.jpt ?? '—'}</b> J/tok</span>` +
          `<button class="eject" title="stop">⏏</button>`;
        d.querySelector('.eject').onclick = (ev) => { ev.stopPropagation(); stopModel(e.model); };
        d.ondragstart = (ev) => ev.dataTransfer.setData('stop', e.model);
      } else if (e.state === 'loading') {
        d.className = 'slot loading';
        d.innerHTML += `<span class="mname">${e.model}</span><span class="spin">⏳ ${T().slotLoading}</span>`;
      } else if (e.state === 'unknown') {
        d.className = 'slot';
        d.innerHTML += `<span style="color:var(--warn)">${T().slotNoRbac}</span>`;
      } else {
        d.className = 'slot';
        d.innerHTML += `<span>${T().slotEmpty}</span>`;
        d.ondragover = (ev) => { ev.preventDefault(); d.classList.add('dropok'); };
        d.ondragleave = () => d.classList.remove('dropok');
        d.ondrop = (ev) => { ev.preventDefault(); d.classList.remove('dropok');
          const m = ev.dataTransfer.getData('start'); if (m) modelCtl('start', m); };
        d.onclick = () => { if (tapSel) { modelCtl('start', tapSel); tapSel = null; } };
        stopped.push(null);
      }
      rk.appendChild(d);
    });
    const chips = rack.filter(e => e.state === 'stopped');
    sh.innerHTML = chips.length ? '' : `<span class="shelfHint">${T().shelfHint}</span>`;
    chips.forEach(e => {
      const c = document.createElement('div');
      c.className = 'chip' + (tapSel === e.model ? ' selq' : '');
      c.textContent = e.model; c.draggable = true;
      c.ondragstart = (ev) => ev.dataTransfer.setData('start', e.model);
      c.onclick = () => { tapSel = (tapSel === e.model) ? null : e.model; renderRack(rack); };
      sh.appendChild(c);
    });
    sh.ondragover = (ev) => { ev.preventDefault(); sh.classList.add('dropok'); };
    sh.ondragleave = () => sh.classList.remove('dropok');
    sh.ondrop = (ev) => { ev.preventDefault(); sh.classList.remove('dropok');
      const m = ev.dataTransfer.getData('stop'); if (m) stopModel(m); };
  }

  let agentScenarios = null;
  async function refreshAgent() {
    try {
      const r = await fetch(BASE + 'api/agent');
      if (!r.ok) return;
      const a = await r.json();
      if (!agentScenarios) {
        agentScenarios = a.scenarios;
        const box = document.getElementById('agentBtns');
        box.innerHTML = '';
        Object.entries(a.scenarios).forEach(([k, lbls]) => {
          const b = document.createElement('button');
          b.className = 'abtn'; b.textContent = '🤖 ' + lbls[lang];
          b.onclick = async () => {
            b.disabled = true;
            try { await fetch(BASE + 'api/agent/start', {method:'POST',
              headers:{'Content-Type':'application/json'}, body: JSON.stringify({scenario:k})}); }
            finally { setTimeout(()=>b.disabled=false, 1500); }
          };
          box.appendChild(b);
        });
      }
      const out = document.getElementById('agentRuns');
      if (!a.runs.length) { out.textContent = T().noAgent; return; }
      out.innerHTML = a.runs.map(r => {
        const st = {running:T().agentRunning, done:T().agentDone, failed:T().agentFailed}[r.status] || r.status;
        const steps = r.steps.map(sp =>
          `<span class="astep"><span class="adot ${sp.status}"></span>${sp.title}·${sp.model.replace('qwen','q')}${sp.tokens?(' +'+sp.tokens):''}</span>`).join('');
        const bill = r.bill ? `<div class="abill">${T().billLine(r.bill)}</div>` : '';
        return `<div style="margin-bottom:12px"><b style="color:var(--ink)">${r.task_id}</b> · ${st}` +
               (r.error?` · <span style="color:var(--warn)">${r.error}</span>`:'') +
               `<div style="margin-top:5px">${steps}</div>${bill}</div>`;
      }).join('');
    } catch (e) { /* keep */ }
  }
  setInterval(refreshAgent, 2000); refreshAgent();

  document.querySelectorAll('.scenebtn').forEach(b => b.onclick = async () => {
    if (!sel.models.size) { say(T().pickModel, 'err'); return; }
    say(T().starting);
    const d = await post(BASE + 'api/start',
      {models: [...sel.models], shape: sel.shape, scene: b.dataset.scene});
    report(d); refresh();
  });
  document.getElementById('stop').onclick = async () => {
    const d = await post(BASE + 'api/stop');
    say(T().stopped(d.stopped || 0), 'ok'); refresh();
  };
  document.getElementById('lg').onclick = async (e) => {
    const on = e.target.dataset.on === '1';
    say(on ? T().lgClosing : T().lgOpening);
    const d = await post(BASE + 'api/loadgen', {on: !on});
    say(d.error ? ('✗ ' + d.error) : (on ? T().lgClosed : T().lgOpened), d.error ? 'err' : 'ok');
    refresh();
  };
  document.getElementById('lang').onclick = () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('demo_lang', lang);
    applyStatic();
    if (statusCache) buildPickers(statusCache);
    agentScenarios = null; // rebuild agent buttons in the new language
    refresh(); refreshAgent();
  };
  applyStatic(); refresh(); setInterval(refresh, 5000);
</script></main></body></html>
