<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xModeling · Try the Agent</title>
<style>
  /* xModeling / xFusion portal look — mirrors csg-portal: white surface,
     brand red #C7000B, 2px radii, gray-50 sidebar, gray bubble language. */
  :root{--brand:#C7000B;--brand-dark:#9F0009;--brand-50:#FDF3F3;--brand-200:#F4CCCE;
        --ink:#1f2937;--soft:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--side:#f9fafb;--codebg:#f3f4f6}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#fff;color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
       display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;
         border-bottom:1px solid var(--line);padding:10px 18px;flex-shrink:0}
  h1{font-size:16.5px;font-weight:700}
  h1 .mark{color:var(--brand)}
  header .sub{color:var(--soft);font-size:12px;margin-top:1px}
  #lang{border:1px solid var(--line);background:#fff;color:var(--soft);border-radius:2px;
        padding:4px 11px;font-size:12.5px;cursor:pointer}
  #lang:hover{border-color:var(--brand);color:var(--brand)}
  main{flex:1;display:flex;min-height:0}
  /* left: session sidebar (portal: w-60 bg-gray-50/60 border-r) */
  aside{width:224px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);
        display:flex;flex-direction:column;padding:12px 10px;gap:8px}
  #newBtn{width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink);
          padding:8px 10px;font-size:13px;cursor:pointer;text-align:center}
  #newBtn:hover{border-color:var(--brand);color:var(--brand)}
  #sesList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
  .ses{border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12.5px;display:flex;
       justify-content:space-between;gap:6px;align-items:center;color:var(--ink)}
  .ses:hover{background:#fff}
  .ses.sel{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .ses .st{font-size:11px}
  .st-running{color:#16a34a}.st-closed,.st-expired{color:var(--faint)}
  .sideNote{color:var(--faint);font-size:11px;padding:0 4px}
  .mlabel{color:var(--faint);font-size:10.5px;letter-spacing:.06em;padding:2px 4px 0}
  .mopt{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;
        font-size:12px;cursor:pointer;font-family:'SF Mono',Monaco,Menlo,monospace;color:var(--ink)}
  .mopt.sel{border-color:var(--brand);color:var(--brand);background:var(--brand-50);font-weight:700}
  .ses .mdl{color:var(--faint);font-size:10.5px;font-family:'SF Mono',Monaco,Menlo,monospace}
  /* center: chat */
  #center{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
  #chat{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
  .msg{padding:9px 15px;max-width:86%;white-space:pre-wrap;word-break:break-word;font-size:14px}
  .user{background:#1f2937;color:#fff;border-radius:16px 16px 4px 16px;align-self:flex-end}
  .agent{background:var(--codebg);color:var(--ink);border-radius:16px 16px 16px 4px;align-self:flex-start}
  .think{color:var(--faint);font-size:12px;border-left:2px solid var(--line);padding-left:10px;
         margin-bottom:6px;white-space:pre-wrap}
  .toolcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);
            border-radius:2px;padding:8px 12px;font-family:'SF Mono',Monaco,Menlo,monospace;font-size:12px;
            color:var(--soft);align-self:flex-start;max-width:86%;overflow-x:auto;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .toolcard .tn{color:var(--brand);font-weight:700}
  .toolcard.err{border-left-color:#dc2626;background:#fef2f2}
  .sysline{color:var(--faint);font-size:12px;text-align:center}
  .typing{color:var(--brand)}
  #bar{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-shrink:0}
  #inp{flex:1;background:#fff;border:1px solid var(--line);border-radius:2px;color:var(--ink);
       padding:10px 13px;font-size:14px;outline:none}
  #inp:focus{border-color:var(--brand)}
  #send{background:var(--brand);border:0;border-radius:2px;color:#fff;font-weight:600;
        padding:10px 22px;cursor:pointer;font-size:14px}
  #send:hover{background:var(--brand-dark)}
  #send:disabled{opacity:.45;cursor:default}
  .hints{padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
  .hint{border:1px solid var(--line);background:var(--side);color:var(--soft);border-radius:14px;
        padding:3px 12px;font-size:12px;cursor:pointer}
  .hint:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-50)}
  /* right: metering detail */
  #meter{width:296px;flex-shrink:0;background:var(--side);border-left:1px solid var(--line);
         overflow-y:auto;padding:14px 14px 20px}
  #meter h3{font-size:11.5px;letter-spacing:.08em;color:var(--brand);font-weight:700;margin:14px 0 8px}
  #meter h3:first-child{margin-top:0}
  .mtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mtile{background:#fff;border:1px solid var(--line);border-radius:2px;padding:8px 10px}
  .mtile .k{color:var(--faint);font-size:10.5px;letter-spacing:.05em}
  .mtile .v{font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .mtile .v small{font-size:11px;color:var(--soft);font-weight:400}
  table{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;border:1px solid var(--line)}
  th,td{padding:5px 8px;text-align:left;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
  th{color:var(--soft);font-weight:600;font-size:10.5px;background:var(--codebg)}
  td.num,th.num{text-align:right}
  tr:last-child td{border-bottom:0}
  .mnote{color:var(--faint);font-size:11px;margin-top:8px}
  #msplit{margin-top:8px}
  #msplit .bar{display:flex;height:10px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
  #msplit .seg-gpu{background:var(--brand)}
  #msplit .seg-host{background:#9ca3af}
  #msplit .lg{display:flex;gap:14px;font-size:10.5px;color:var(--soft);margin-top:4px}
  #msplit .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  @media(max-width:960px){#meter{display:none}}
  @media(max-width:680px){aside{display:none}}
</style>
</head>
<body>
<header><div><h1><span class="mark">⚡</span> <span data-i18n="title"></span></h1>
<div class="sub" data-i18n="sub"></div></div><button id="lang">EN</button></header>

<main>
  <aside>
    <button id="newBtn" data-i18n="newSes"></button>
    <div class="mlabel" data-i18n="mdlLabel"></div>
    <div id="mpick" style="display:flex;flex-direction:column;gap:4px"></div>
    <div class="mlabel" style="margin-top:6px" data-i18n="sesLabel"></div>
    <div id="sesList"></div>
    <div class="sideNote" data-i18n="sideNote"></div>
  </aside>

  <div id="center">
    <div id="chat"><div class="sysline" data-i18n="hello"></div></div>
    <div class="hints" id="hints"></div>
    <div id="bar">
      <input id="inp">
      <button id="send" data-i18n="send"></button>
    </div>
  </div>

  <div id="meter">
    <h3 data-i18n="mTitle"></h3>
    <div class="mtiles" id="mtiles"></div>
    <div id="msplit"></div>
    <h3 data-i18n="mByModel"></h3>
    <table><thead><tr><th data-i18n="thModel"></th><th class="num" data-i18n="thCalls"></th><th class="num">tok</th><th class="num">J</th></tr></thead>
    <tbody id="mmodels"><tr><td colspan="4" style="color:var(--faint)" data-i18n="mWait"></td></tr></tbody></table>
    <h3 data-i18n="mCalls"></h3>
    <table><thead><tr><th data-i18n="thModel"></th><th class="num">tok</th><th class="num">J/tok</th><th class="num">J</th></tr></thead>
    <tbody id="mcalls"><tr><td colspan="4" style="color:var(--faint)" data-i18n="mWait"></td></tr></tbody></table>
    <div class="mnote" data-i18n="mNote"></div>
  </div>
</main>

<script>
const I18N = {
  zh: {
    title:'xModeling Agent 体验', sub:'agent 在沙箱里规划、写文件、跑命令 · 右侧实时计量明细',
    newSes:'＋ 新建会话', mdlLabel:'模型(新会话生效)', sesLabel:'会话列表', sideNote:'会话 15 分钟后自动回收', hello:'输入任务开始,或点下方示例。',
    send:'发送', ph:'例如:写一个 Node 脚本统计 1..100 的质数并运行验证',
    mTitle:'本会话能耗账单', mByModel:'按模型拆分', mCalls:'逐次调用', mWait:'等待首条消息…',
    mNote:'归因方式 token-share · 数据来自 task-gateway 实时计量(8×H100 实测 J/token)',
    tiles:[['调用','calls',''],['输出 tok','output_tokens',''],['GPU 能耗','gpu_joules','J'],['主机(CPU+内存)','host_joules','J'],['系统合计','system_joules','J'],['电费','cost_usd','$'],['碳排','co2_grams','g']],
    lgGpu:'GPU', lgHost:'主机(CPU+内存)',
    perm:(t,ok)=>ok?`✓ 已批准工具 ${t}`:`✗ 已拒绝工具 ${t}(白名单外)`,
    running:'agent 思考/执行中…', turnEnd:'✔ 本轮完成', closed:'会话已结束,可新建会话', expired:'会话超时回收,可新建会话',
    busy:'体验人数已满,请稍候再试', gone:'该会话已随服务回收',
    st:{running:'进行中',closed:'已结束',expired:'已回收'},
    hints:['写一个 Node 脚本统计 1..100 的质数并运行验证','创建 haiku.txt 写三行俳句,再用 bash 数它的字数','写一个 JSON 格式校验小工具并测试它'],
  },
  en: {
    title:'xModeling Agent Demo', sub:'The agent plans, writes files and runs commands in a sandbox · live metering on the right',
    newSes:'＋ New session', mdlLabel:'MODEL (for new sessions)', sesLabel:'SESSIONS', sideNote:'Sessions are recycled after 15 min', hello:'Type a task, or pick an example below.',
    send:'Send', ph:'e.g. Write a Node script that lists primes in 1..100 and run it',
    mTitle:'Session energy bill', mByModel:'By model', mCalls:'Per call', mWait:'Waiting for first message…',
    mNote:'token-share attribution · live J/token measured on the 8×H100 fleet via task-gateway',
    tiles:[['CALLS','calls',''],['OUT TOK','output_tokens',''],['GPU','gpu_joules','J'],['HOST (CPU+RAM)','host_joules','J'],['SYSTEM TOTAL','system_joules','J'],['COST','cost_usd','$'],['CO₂','co2_grams','g']],
    lgGpu:'GPU', lgHost:'Host (CPU+RAM)',
    perm:(t,ok)=>ok?`✓ approved ${t}`:`✗ denied ${t} (not whitelisted)`,
    running:'agent thinking / executing…', turnEnd:'✔ turn complete', closed:'Session ended — start a new one', expired:'Session expired — start a new one',
    busy:'All slots busy — try again shortly', gone:'This session was recycled',
    st:{running:'active',closed:'ended',expired:'expired'},
    hints:['Write a Node script that lists primes in 1..100 and run it','Create haiku.txt with a 3-line haiku, then count its words with bash','Build and test a tiny JSON validator'],
  },
};
let lang=localStorage.getItem('booth_lang')||(navigator.language&&navigator.language.startsWith('zh')?'zh':'en');
const T=()=>I18N[lang];
const $=(id)=>document.getElementById(id);
function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=T()[el.dataset.i18n]||'');
  $('inp').placeholder=T().ph;
  $('lang').textContent=lang==='zh'?'EN':'中文';
  document.documentElement.lang=lang;
  const hb=$('hints');hb.innerHTML='';
  T().hints.forEach(h=>{const d=document.createElement('div');d.className='hint';d.textContent=h;
    d.onclick=()=>{$('inp').value=h;$('inp').focus();};hb.appendChild(d);});
  renderSessions();renderBill(lastBill);
}
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('booth_lang',lang);applyStatic();renderPicker();};

/* ---------- session management (per-browser list, portal-style sidebar) --- */
let mySessions=JSON.parse(localStorage.getItem('booth_sessions')||'[]'); // [{sid,ts,model}]
let modelList=[],pickedModel=null;
async function loadModels(){
  try{
    const j=await (await fetch('api/models')).json();
    modelList=j.models;pickedModel=pickedModel||j.default;
    renderPicker();
  }catch{}
}
function renderPicker(){
  const box=$('mpick');box.innerHTML='';
  modelList.forEach(mo=>{
    const d=document.createElement('div');
    d.className='mopt'+(mo===pickedModel?' sel':'');
    d.textContent=mo;
    d.onclick=()=>{pickedModel=mo;renderPicker();};
    box.appendChild(d);
  });
}
let sid=null,es=null,typing=null,lastBill=null,statusCache={};
function saveSessions(){localStorage.setItem('booth_sessions',JSON.stringify(mySessions.slice(0,12)));}
function renderSessions(){
  const box=$('sesList');box.innerHTML='';
  mySessions.forEach(s=>{
    const d=document.createElement('div');
    d.className='ses'+(s.sid===sid?' sel':'');
    const st=statusCache[s.sid]||'…';
    const label=(lang==='zh'?'会话 ':'#')+s.sid.replace('visitor-','');
    const mdl=s.model?`<div class="mdl">${s.model.replace('qwen','q')}</div>`:'';
    d.innerHTML=`<span>${label}${mdl}</span><span class="st st-${st}">${T().st[st]||st}</span>`;
    d.onclick=()=>attach(s.sid);
    box.appendChild(d);
  });
}
async function refreshStatuses(){
  for(const s of [...mySessions]){
    try{
      const r=await fetch(`api/session/${s.sid}/info`);
      if(r.status===404){mySessions=mySessions.filter(x=>x.sid!==s.sid);saveSessions();continue;}
      statusCache[s.sid]=(await r.json()).status;
    }catch{}
  }
  renderSessions();
}
async function createSession(){
  const r=await fetch('api/session',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:pickedModel})});
  if(r.status===429){addSys(T().busy);return null;}
  const j=await r.json();
  mySessions.unshift({sid:j.sid,ts:Date.now(),model:j.model});saveSessions();
  statusCache[j.sid]='running';
  return j.sid;
}
function attach(id){
  if(es){es.close();es=null;}
  sid=id;lastBill=null;
  $('chat').innerHTML='';typing=null;
  renderSessions();renderBill(null);
  es=new EventSource(`api/session/${sid}/events`);
  es.onmessage=(m)=>handleEvent(JSON.parse(m.data));
  es.onerror=()=>{};
  refreshBill();
}
$('newBtn').onclick=async()=>{const id=await createSession();if(id)attach(id);};

/* ---------- chat rendering --------------------------------------------- */
const chat=$('chat');
function add(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
const addSys=(t)=>add('sysline',t);
const esc=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function handleEvent(ev){
  if(typing){typing.remove();typing=null;}
  if(ev.t==='user')add('msg user',esc(ev.text));
  else if(ev.t==='text'){
    const parts=ev.text.split('</think>');
    const body=(parts.length>1?parts.pop():parts[0]).trim();
    const think=parts.join('</think>').trim();
    let html='';
    if(think)html+=`<div class="think">${esc(think)}</div>`;
    if(body)html+=esc(body);
    if(html)add('msg agent',html);
  }
  else if(ev.t==='tool.call')add('toolcard',`<span class="tn">${ev.name}</span> ${esc(ev.input)}`);
  else if(ev.t==='tool.result')add('toolcard'+(ev.error?' err':''),esc(ev.output));
  else if(ev.t==='perm')addSys(T().perm(ev.tool,ev.allowed));
  else if(ev.t==='turn.end'){addSys(T().turnEnd);$('send').disabled=false;refreshBill();}
  else if(ev.t==='closed'){addSys(T().closed);statusCache[sid]='closed';renderSessions();}
  else if(ev.t==='expired'){addSys(T().expired);statusCache[sid]='expired';renderSessions();}
  if(['user','text','tool.call','tool.result','perm'].includes(ev.t))
    typing=add('sysline typing',T().running);
}

/* ---------- metering panel --------------------------------------------- */
function fmtV(key,v){
  if(v==null)return '—';
  if(key==='cost_usd')return v.toFixed(5);
  if(key==='co2_grams')return v.toFixed(2);
  if(key==='gpu_joules'||key==='system_joules'||key==='host_joules')return Math.round(v).toLocaleString();
  return Number(v).toLocaleString();
}
function renderBill(b){
  lastBill=b;
  if(b&&b.system_joules>0)b.host_joules=b.system_joules-b.gpu_joules;
  const tiles=$('mtiles');tiles.innerHTML='';
  T().tiles.forEach(([label,key,unit])=>{
    const d=document.createElement('div');d.className='mtile';
    d.innerHTML=`<div class="k">${label}</div><div class="v">${b?fmtV(key,b[key]):'—'} <small>${unit}</small></div>`;
    tiles.appendChild(d);
  });
  const sp=$('msplit');
  if(b&&b.system_joules>0){
    const g=100*b.gpu_joules/b.system_joules, h=100-g;
    sp.innerHTML=`<div class="bar"><div class="seg-gpu" style="width:${g.toFixed(1)}%"></div>`+
      `<div class="seg-host" style="width:${h.toFixed(1)}%"></div></div>`+
      `<div class="lg"><span><span class="sw seg-gpu"></span>${T().lgGpu} ${g.toFixed(0)}%</span>`+
      `<span><span class="sw seg-host"></span>${T().lgHost} ${h.toFixed(0)}%</span></div>`;
  }else sp.innerHTML='';
  const mm=$('mmodels');
  mm.innerHTML=(b&&b.by_model&&b.by_model.length)?b.by_model.map(m=>`<tr>
      <td>${m.model.replace('qwen','q')}</td><td class="num">${m.calls}</td>
      <td class="num">${m.output_tokens}</td><td class="num">${Math.round(m.gpu_joules)}</td></tr>`).join('')
    :`<tr><td colspan="4" style="color:var(--faint)">${T().mWait}</td></tr>`;
  const mc=$('mcalls');
  mc.innerHTML=(b&&b.recent_calls&&b.recent_calls.length)?b.recent_calls.slice().reverse().map(c=>`<tr>
      <td>${c.model.replace('qwen','q')}</td><td class="num">${c.output_tokens}</td>
      <td class="num">${c.j_per_token_used.toFixed(2)}</td><td class="num">${Math.round(c.gpu_joules)}</td></tr>`).join('')
    :`<tr><td colspan="4" style="color:var(--faint)">${T().mWait}</td></tr>`;
}
async function refreshBill(){
  if(!sid)return;
  try{
    const r=await fetch(`api/session/${sid}/bill`);
    if(!r.ok)return;
    const b=await r.json();
    if(b.calls)renderBill(b);
  }catch{}
}
setInterval(refreshBill,4000);
setInterval(refreshStatuses,8000);

/* ---------- send -------------------------------------------------------- */
async function send(){
  const text=$('inp').value.trim();
  if(!text)return;
  if(!sid||statusCache[sid]!=='running'){
    const id=await createSession();
    if(!id)return;
    attach(id);
  }
  $('inp').value='';
  typing=add('sysline typing',T().running);
  $('send').disabled=true;
  let r=await fetch(`api/session/${sid}/msg`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text})});
  if(r.status===404||r.status===400){
    // Stale session (server restarted): drop it, open a fresh one, resend.
    mySessions=mySessions.filter(x=>x.sid!==sid);saveSessions();
    const id=await createSession();
    if(!id){$('send').disabled=false;return;}
    attach(id);
    typing=add('sysline typing',T().running);
    r=await fetch(`api/session/${sid}/msg`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})});
    if(r.ok)add('msg user',esc(text));
  }
}
$('send').onclick=send;
$('inp').addEventListener('keydown',(e)=>{if(e.key==='Enter')send();});

applyStatic();loadModels();
refreshStatuses().then(()=>{
  const alive=mySessions.find(s=>statusCache[s.sid]==='running')||mySessions[0];
  if(alive)attach(alive.sid);
});
</script>
</body>
</html>
