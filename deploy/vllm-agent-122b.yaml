# Dedicated agent-grade large model — qwen3.5-122B-A10B-Int4 on 4×H100-80G.
# Unlike the fleet's single-GPU showcase deployment (enforce-eager, 4k ctx),
# this one is sized for agent work: TP=4, CUDA graphs on, 64k context,
# tool calling enabled. Served under its own name so the task-gateway routes
# agent traffic here without touching the H100 fleet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-agent-122b
  namespace: aitra-system
  labels:
    app: vllm-agent-122b
    tier: agent-models
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-agent-122b
  template:
    metadata:
      labels:
        app: vllm-agent-122b
        aitra-ai.github.io/model-name: qwen3.5-122b-agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.19.0
          imagePullPolicy: Never
          args:
            - --model
            - /models/q35-122b-int4
            - --served-model-name
            - qwen3.5-122b-agent
            - --tensor-parallel-size
            - "4"
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "65536"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_xml
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 4
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 120
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: model
              mountPath: /models
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: model
          hostPath:
            path: /home/aitra-models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-agent-122b
  namespace: aitra-system
  labels:
    app: vllm-agent-122b
spec:
  selector:
    app: vllm-agent-122b
  ports:
    - port: 8000
      targetPort: 8000
